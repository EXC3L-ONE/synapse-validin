name: ex-validin
version: 2.0.0
synapse_minversion: [2, 140, 0]
desc: The ex-validin package provides an interface to the Validin API allowing for enrichment of `inet:ipv4` and `inet:fqdn` nodes.

author:
  url: https://github.com/EXC3L-ONE
  name: EXC3L

genopts:
  dotstorm: true

perms:
  - perm: [ex, validin, user]
    desc: Allows a user to leverage the ex-validin package
    gate: cortex

modules:
  - name: ex.validin.api
  - name: ex.validin.privsep
    asroot:perms:
      - [ex, validin, user]

onload: $lib.import(ex.validin.privsep).setValidinExtendedProps()

commands:
  - name: ex.validin.setup.apikey
    descr: Set the API key to use with validin (required)
    perms:
      - [ex, validin, user]
    cmdargs:
      - - apikey
        - type: str
          help: The API Key
      - - --self
        - type: bool
          default: false
          action: store_true
          help: Set the key as a user variable. If not used, the key is set globally.
      - - --debug
        - type: bool
          default: false
          action: store_true
          help: Show verbose debug output.
          
  - name: ex.validin.setup.tagprefix
    descr: Set the tag prefix used when recording validin tags. Defaults to `rep.validin`.
    perms:
      - [ex, validin, user]
    cmdargs:
      - - tagname
        - type: str
          default: rep.validin
          help: The tag prefix to use.

  - name: ex.validin.setup.apihostname
    descr: Set the API hostname used for making API requests. Defaults to `api.validin.com`
    perms:
      - [ex, validin, user]
    cmdargs:
      - - hostname
        - type: str
          default: api.validin.com
          help: The domain hostname to use.

  - name: ex.validin.pdns
    descr: Fetches Passive DNS data for given `inet:ipv4` and `inet:fqdn` nodes.
    perms:
      - [ex, validin, user]
    cmdargs:
      - - --include-extra
        - type: bool
          default: false
          action: store_true
          help: Include extra DNS record types (MX, NS, TXT) at a cost of 1 extra API call per node. Only works for `inet:fqdn` nodes
      - - --yield
        - type: bool
          default: false
          action: store_true
          help: Yield the newly created nodes rather than the input nodes.
      - - --debug
        - type: bool
          default: false
          action: store_true
          help: Show verbose debug output.
    forms:
      inputs:
        - inet:ipv4
        - inet:fqdn

  - name: ex.validin.host.subdomains
    descr: Fetches subdomains for a given `inet:fqdn` node
    perms:
      - [ex, validin, user]
    cmdargs:
      - - --yield
        - type: bool
          default: false
          action: store_true
          help: Yield the newly created nodes rather than the input inet:fqdn nodes.
      - - --debug
        - type: bool
          default: false
          action: store_true
          help: Show verbose debug output.
    forms:
      inputs:
        - inet:fqdn

  - name: ex.validin.host.responses
    descr: Ingests all the host responses as `inet:http:request` nodes
    perms:
      - [ex, validin, user]
    cmdargs:
      - - --yield
        - type: bool
          default: false
          action: store_true
          help: Yield the newly created nodes rather than the input nodes.
      - - --debug
        - type: bool
          default: false
          action: store_true
          help: Show verbose debug output.
    forms:
      inputs:
        - inet:fqdn
        - inet:ipv4

  - name: ex.validin.host.search
    descr: Searches Validin dataset using the Advanced Search syntax
    perms:
      - [ex, validin, user]
    cmdargs:
      - - query
        - type: str
          help: The search query to run in Validin
      - - --debug
        - type: bool
          default: false
          action: store_true
          help: Show verbose debug output.
          
  - name: ex.validin.whois
    descr: Fetches WHOIS registration history for given `inet:fqdn` nodes (automatically pivots to apex domain).
    perms:
      - [ex, validin, user]
    cmdargs:
      - - --yield
        - type: bool
          default: false
          action: store_true
          help: Yield the newly created nodes rather than the input inet:fqdn nodes.
      - - --debug
        - type: bool
          default: false
          action: store_true
          help: Show verbose debug output.
    forms:
      inputs:
        - inet:fqdn

  - name: ex.validin.project.list
    descr: Retrieves Validin projects and creates proj:project nodes
    perms:
      - [ex, validin, user]
    cmdargs:
      - - --yield
        - type: bool
          default: false
          action: store_true
          help: Yield the newly created nodes rather than the input nodes.
      - - --debug
        - type: bool
          default: false
          action: store_true
          help: Show verbose debug output.

  - name: ex.validin.project.indicators.get
    descr: Retrieves and syncs indicators from Validin projects to Synapse
    perms:
      - [ex, validin, user]
    cmdargs:
      - - --yield
        - type: bool
          default: false
          action: store_true
          help: Yield the newly created indicator nodes rather than the input proj:project nodes.
      - - --all
        - type: bool
          default: false
          action: store_true
          help: Process all Validin proj:project nodes instead of requiring input nodes.
      - - --debug
        - type: bool
          default: false
          action: store_true
          help: Show verbose debug output.
    forms:
      inputs:
        - proj:project

  - name: ex.validin.project.indicators.add
    descr: Adds indicators to a Validin project and creates project links in Synapse
    perms:
      - [ex, validin, user]
    cmdargs:
      - - project_identifier
        - type: str
          help: The Validin project name or GUID to add indicators to
      - - --debug
        - type: bool
          default: false
          action: store_true
          help: Show verbose debug output.
    forms:
      inputs:
        - inet:fqdn
        - inet:ipv4
        - inet:ipv6
        - hash:md5
        - hash:sha1
        - hash:sha256

  - name: ex.validin.project.indicators.delete
    descr: Removes indicators from a Validin project and cleans up project links in Synapse
    perms:
      - [ex, validin, user]
    cmdargs:
      - - project_identifier
        - type: str
          help: The Validin project name or GUID to remove indicators from
      - - --debug
        - type: bool
          default: false
          action: store_true
          help: Show verbose debug output.
    forms:
      inputs:
        - inet:fqdn
        - inet:ipv4
        - inet:ipv6
        - hash:md5
        - hash:sha1
        - hash:sha256

  - name: ex.validin.project.set
    descr: Sets the active Validin project for indicator management operations
    perms:
      - [ex, validin, user]
    cmdargs:
      - - project_identifier
        - type: str
          help: The Validin project name or GUID to set as active
      - - --self
        - type: bool
          default: false
          action: store_true
          help: Set the project as a user variable. If not used, the project is set globally.
    forms:
      inputs:
        - proj:project


  - name: ex.validin.threat.group.indicators
    descr: Retrieves reported indicators for a named threat group
    perms:
      - [ex, validin, user]
    cmdargs:
      - - threat_key
        - type: str
          help: Key for the threat group
      - - --limit
        - type: int
          default: 0
          help: Maximum number of indicators to process (0 for unlimited).
      - - --yield
        - type: bool
          default: false
          action: store_true
          help: Yield the newly created nodes rather than the input nodes.
      - - --debug
        - type: bool
          default: false
          action: store_true
          help: Show verbose debug output.

  - name: ex.validin.domain.reputation
    descr: Retrieves reputation information for a domain
    perms:
      - [ex, validin, user]
    cmdargs:
      - - domain
        - type: str
          help: Domain to get reputation for
      - - --yield
        - type: bool
          default: false
          action: store_true
          help: Yield the newly created nodes rather than the input nodes.
      - - --debug
        - type: bool
          default: false
          action: store_true
          help: Show verbose debug output.

optic:
    actions:
      - name: pdns (A & AAAA only)
        storm: ex.validin.pdns
        descr: Get passive DNS information from Validin
        forms: [ inet:fqdn, inet:ipv4 ]
      - name: pdns (all types)
        storm: ex.validin.pdns --include-extra
        descr: Get passive DNS information from Validin
        forms: [ inet:fqdn, inet:ipv4 ]
      - name: host responses
        storm: ex.validin.host.responses
        descr: Get host responses from Validin
        forms: [ inet:fqdn, inet:ipv4 ]
      - name: host subdomains
        storm: ex.validin.host.subdomains
        descr: Get subdomains from Validin
        forms: [ inet:fqdn ]
      - name: whois
        storm: ex.validin.whois
        descr: Get domain registration information from Validin (pivots to apex domain)
        forms: [ inet:fqdn ]
      - name: domain reputation
        storm: ex.validin.domain.reputation $node.repr()
        descr: Get domain reputation scores and risk tags from Validin
        forms: [ inet:fqdn ]
      - name: add to active project
        storm: 'ex.validin.project.indicators.add $lib.user.vars.get("validin:active_project")'
        descr: Add this indicator to the active Validin project (use ex.validin.project.set to set active project)
        forms: [ inet:fqdn, inet:ipv4, inet:ipv6, hash:md5, hash:sha1, hash:sha256 ]
      - name: remove from active project
        storm: 'ex.validin.project.indicators.delete $lib.user.vars.get("validin:active_project")'
        descr: Remove this indicator from the active Validin project
        forms: [ inet:fqdn, inet:ipv4, inet:ipv6, hash:md5, hash:sha1, hash:sha256 ]
      - name: set as active project
        storm: ex.validin.project.set :name --self
        descr: Set this project as your active Validin project for indicator operations
        forms: [ proj:project ]
      - name: get project indicators
        storm: ex.validin.project.indicators.get --yield
        descr: Sync indicators from this Validin project to Synapse
        forms: [ proj:project ]